<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geospatial File Measurement</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #000; background: #fff; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
  form { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
  button { padding: .45rem 1rem; cursor: pointer; background: #000; color: #fff; border: 1px solid #000; border-radius: 4px; }
  button:hover { background: #fff; color: #000; }
  #message { margin: .75rem 0; }
  .error { font-weight: bold; }
  pre { background: #fff; border: 1px solid #000; padding: .75rem 1rem; overflow-x: auto; font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { border: 1px solid #000; padding: .35rem .6rem; text-align: left; font-size: .9rem; }
  th { background: #000; color: #fff; }
  .hint { color: #444; font-size: .9rem; }
  a { color: #000; }
  #downloads { display: flex; gap: .5rem; margin-top: 1rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Geospatial File Measurement</h1>
  <p class="hint">Upload a zipped Shapefile (.zip) or a .kml file to get area and length for each feature.</p>
  <p class="hint"> API docs are at <a href="/docs">/docs</a>.</p>

  <form id="upload-form">
    <input type="file" id="file" accept=".zip,.kml" required>
    <button type="submit">Upload</button>
  </form>

  <div id="message"></div>

  <section id="output" hidden>
    <h2>File information</h2>
    <pre id="info"></pre>

    <h2>Measurements</h2>
    <div id="table"></div>

    <div id="downloads">
      <button type="button" id="dl-csv">Download CSV</button>
      <button type="button" id="dl-json">Download JSON</button>
    </div>
  </section>

<script>
const form = document.getElementById("upload-form");
const message = document.getElementById("message");
const output = document.getElementById("output");
let current = null; // { info, measurements } of the last successful upload

const COLUMNS = ["id", "geometry_type", "area_sq_m", "length_m", "projected_crs", "note"];

function show(text, isError) {
  message.textContent = text;
  message.className = isError ? "error" : "";
}

function cell(row, value) {
  const td = document.createElement("td");
  td.textContent = value === undefined || value === null ? "" : value;
  row.appendChild(td);
}

function download(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function csvValue(value) {
  if (value === undefined || value === null) return "";
  const text = String(value);
  return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function baseName() {
  return current.info.filename.replace(/\.[^.]+$/, "");
}

document.getElementById("dl-csv").addEventListener("click", () => {
  const lines = [COLUMNS.join(",")];
  current.measurements.forEach((m) => lines.push(COLUMNS.map((c) => csvValue(m[c])).join(",")));
  download(baseName() + "_measurements.csv", lines.join("\n"), "text/csv");
});

document.getElementById("dl-json").addEventListener("click", () => {
  const data = { file: current.info, measurements: current.measurements };
  download(baseName() + "_measurements.json", JSON.stringify(data, null, 2), "application/json");
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  output.hidden = true;
  current = null;
  const file = document.getElementById("file").files[0];
  if (!file) return;

  show("Uploading...", false);
  const body = new FormData();
  body.append("file", file);

  try {
    const upload = await fetch("/api/files/", { method: "POST", body });
    const info = await upload.json();
    if (!upload.ok) {
      show(info.detail || "Upload failed", true);
      return;
    }

    const measurements = await (await fetch(`/api/files/${info.id}/measurements/`)).json();
    current = { info, measurements };
    show("", false);

    document.getElementById("info").textContent = JSON.stringify({
      id: info.id,
      filename: info.filename,
      feature_count: info.feature_count,
      crs: info.crs,
      status: info.status,
    }, null, 2);

    const table = document.createElement("table");
    const head = table.insertRow();
    ["ID", "Type", "Area (sq m)", "Length (m)", "Projected CRS", "Note"].forEach((name) => {
      const th = document.createElement("th");
      th.textContent = name;
      head.appendChild(th);
    });
    measurements.forEach((m) => {
      const row = table.insertRow();
      COLUMNS.forEach((c) => cell(row, m[c]));
    });
    const holder = document.getElementById("table");
    holder.innerHTML = "";
    holder.appendChild(table);

    output.hidden = false;
  } catch (err) {
    show("Could not reach the server: " + err.message, true);
  }
});
</script>
</body>
</html>
